name: Release

# Every push and PR builds the DMG (kept as a workflow artifact).
# Pushing a tag like v1.2.0 also publishes it as a GitHub release.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-26  # Xcode 26: the macOS 26 SDK for Liquid Glass
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: src/go.mod

      - name: Vet
        working-directory: src
        run: go vet ./...

      - name: Build DMG
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then VER="${GITHUB_REF_NAME#v}"; else VER="0.0.0-${GITHUB_SHA::7}"; fi
          VER="$VER" ./build-dmg.sh
          (cd dist && shasum -a 256 BuildGate-*.dmg > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - uses: actions/upload-artifact@v4
        with:
          name: BuildGate-dmg
          path: |
            dist/*.dmg
            dist/SHA256SUMS.txt

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.dmg
            dist/SHA256SUMS.txt
          generate_release_notes: true
